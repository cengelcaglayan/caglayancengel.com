name: Günlük site denetimi

on:
  schedule:
    - cron: '0 4 * * *'      # her gün 07:00 Türkiye saati
  workflow_dispatch:          # elle de çalıştırılabilir
  push:
    branches: [main]          # her yayından sonra da denetler

permissions:
  contents: read

jobs:
  denetim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Hesap kontrolu Node ile kosuyor: sayfadaki hesap kodu cekilip referans
      # sonuclarla karsilastiriliyor. Node yoksa denetim eksik koser ve kirmizi yanar.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Hesap kontrolunun kendisi calisiyor mu (yakma testi)
        run: node hesap_testi.js --yerel hesaplamalar.html --yakma
      # Push tetikli kosuda Pages deploy'u henuz bitmemis olabiliyor. 01.09.2026'da
      # denetim push'tan 13 sn sonra kosup ESKI sayfayi olctu ve yanlis alarm verdi.
      # Once canliya yeni surum yayilsin, sonra olculsun.
      - name: Yayinin tamamlanmasini bekle
        if: github.event_name == 'push'
        run: python3 yayin_bekle.py
      - name: Siteyi denetle
        run: python3 denetim.py
