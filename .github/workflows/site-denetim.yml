name: Günlük site denetimi

on:
  schedule:
    - cron: '0 4 * * *'      # her gün 07:00 Türkiye saati
  workflow_dispatch:          # elle de çalıştırılabilir
  push:
    branches: [main]          # her yayından sonra da denetler

permissions:
  contents: read

jobs:
  denetim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Siteyi denetle
        run: python3 denetim.py
