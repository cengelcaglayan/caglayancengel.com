<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sayfa bulunamadı — Çağlayan Çengel</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="fonts.css"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FBFAF6;color:#0F1C2E;font-family:'IBM Plex Sans',system-ui,sans-serif;text-align:center;padding:24px}img{width:64px;margin-bottom:22px}h1{font-family:'Playfair Display',Georgia,serif;font-size:30px;margin:0 0 12px}p{color:#3D4857;margin:0 0 26px}a{display:inline-block;background:#0F1C2E;color:#fff;text-decoration:none;padding:14px 30px;font-size:14px;font-weight:600;letter-spacing:1px}
.wa-top{display:inline-flex;align-items:center;gap:8px;background:#128C7E;color:#fff !important;
  text-decoration:none;border:none !important;padding:10px 18px;border-radius:2px;
  font-size:14.5px;font-weight:600;letter-spacing:.4px;transition:.2s;margin-left:14px}
.wa-top:hover{background:#075E54}
.wa-top svg{opacity:.95}
@media(max-width:520px){.wa-top span{display:none}.wa-top{padding:10px 12px}}
</style>  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="theme-color" content="#0F1C2E">
</head><body><img src="logo.png" alt=""><h1>Aradığınız sayfa yok</h1><p>Bağlantı eski olabilir. Ana sayfadan devam edebilirsiniz.</p><a href="/">Ana sayfa</a><script>
/* Site artik cihaza kurulmuyor (Caglayan karari 02.09.2026): hicbir kopya
   inmez. Once kurulmus olan service worker'i ve onbellegini temizler.
   Yayildiktan sonra bu blok ve /sw.js kaldirilabilir. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(k => k.forEach(r => r.unregister()))
    .catch(() => {});
  if (window.caches) caches.keys().then(a => a.forEach(x => caches.delete(x))).catch(() => {});
}
</script>

<script>
/* ===== HEDEFE ANINDA VARIS · 11.09.2026 =====
   Menuden bir bolume atlandiginda o bolumun bloklari animasyon sirasini
   BEKLEMEZ. Olcum: atlama 3,0 sn kaydirma + 0,8 sn animasyon suruyordu;
   ziyaretci ekrana bakip "geldi mi" diye bekliyordu. */
(function(){
  function ac(){
    var h = location.hash;
    if (!h || h.length < 2) return;
    var s; try { s = document.querySelector(h); } catch(e) { return; }
    if (!s) return;
    var kap = s.closest ? (s.closest('section') || s) : s;
    kap.querySelectorAll('.rv:not(.gor),.rv-ic:not(.gor),.rule:not(.gor)')
       .forEach(function(el){ el.classList.add('gor'); });
    if (kap.classList) kap.classList.add('gor');
    araca(kap);
  }
  /* ===== ARACA IN · 11.09.2026 =====
     Olculdu (1000x700): yapiskan yigin 134px, kullanilabilir ekran 566px.
     Bolum basindan girdilere 389-560px, SONUCUN ALTINA 708-1013px — yani
     13 aracin 13'unde girdi ve sonuc ayni anda GORUNMUYORDU. Arac kutusunun
     kendisi ~453px, ekrana rahat siginca sorun kutunun degil, ustundeki
     baslik+metin yigininin. Bu yuzden bolumun BASINA degil ARACA inilir;
     baslikin alt kismi 60px pay ile gorunur kalir. */
  function araca(kap){
    if (!kap || !kap.querySelector) return;
    var ic = kap.querySelector('.arac-ic') || kap.querySelector('.arac');
    if (!ic) return;                         /* arac tasimayan sayfalar etkilenmez */
    function git(){
      var ust = document.querySelector('.top');
      var bar = document.querySelector('.aracbar');
      var yap = (ust ? ust.getBoundingClientRect().height : 0)
              + (bar ? bar.getBoundingClientRect().height : 0);
      var bosluk = window.innerHeight - yap;           /* kullanilabilir ekran */
      var icYuk  = ic.getBoundingClientRect().height;  /* girdiler + cikti */
      /* Ustte birakilacak pay: kutu siginca baslik da gorunsun, sigmayinca
         payi kis ve hesabin kendisine yer ac. Olculdu 11.09.2026. */
      var pay = Math.max(0, Math.min(120, Math.round(bosluk - icYuk - 8)));
      var h = ic.getBoundingClientRect().top + (window.pageYOffset||0) - yap - pay;
      var enc = Math.max(0, document.body.scrollHeight - window.innerHeight);
      window.scrollTo(0, Math.max(0, Math.min(Math.round(h), enc)));
    }
    /* tarayicinin kendi hash atlamasi bizden SONRA gelebilir — iki kare bekle,
       yazi tipleri gec yuklenirse 'load' sonrasi bir kez daha duzelt. */
    if (window.requestAnimationFrame)
      requestAnimationFrame(function(){ requestAnimationFrame(git); });
    /* rAF gizli sekmede DURUR — yedek zamanlayici (olculdu 11.09.2026).
       git() hedefi her seferinde yeniden hesaplar, iki kez kosmasi zararsiz. */
    setTimeout(git, 45);
    if (document.readyState !== 'complete')
      addEventListener('load', function(){ setTimeout(git, 0); }, { once: true });
  }
  window.addEventListener('hashchange', ac);
  /* Ayni sayfadaki cipa: tarayicinin atlamasini HIC baslatma — yoksa bizim
     konumlandirmamizi eziyor (olculdu 11.09.2026: 13 aracin 11'i sasti). */
  document.addEventListener('click', function(e){
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey ||
        e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest && e.target.closest('a[href*="#"]');
    if (!a || a.target === '_blank') return;
    var ham = a.getAttribute('href') || '';
    var k = ham.indexOf('#');
    var parca = ham.slice(k);
    if (parca.length < 2) return;
    var ayniSayfa = (k === 0) || (a.pathname === location.pathname);
    var s = null; try { s = document.querySelector(parca); } catch (hata) { return; }
    if (ayniSayfa && s) {
      e.preventDefault();
      if (window.history && history.pushState) history.pushState(null, '', parca);
      else location.hash = parca;
      ac();
    } else {
      setTimeout(ac, 0);
    }
  }, true);
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', ac);
  else ac();
})();
</script>
</body></html>
